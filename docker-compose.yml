# docker-compose.yml (on server)
version: '3'
services:
  backend:
    image: ghcr.io/AbdulNasirWaheed/three-tier-app-backend:latest
    ports:
      - "5001:5000"
  frontend:
    image: ghcr.io/AbdulNasirWaheed/three-tier-app-frontend:latest
    ports:
      - "3001:3000"
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
