services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    ports:
      - "5003:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/appdb

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "3003:3000"
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No ports exposed to host — backend reaches it via the internal
    # compose network at "mongodb:27017". Uncomment below only if you
    # need external access, and lock your AWS security group to your IP.
    # ports:
    #   - "27017:27017"

volumes:
  mongo-data:
