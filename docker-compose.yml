services:
  backend:
    image: 375973130701.dkr.ecr.us-east-1.amazonaws.com/three-tier-app-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/appdb

  frontend:
    image: 375973130701.dkr.ecr.us-east-1.amazonaws.com/three-tier-app-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No ports exposed to host — backend reaches it via the internal
    # compose network at "mongodb:27017". Uncomment below only if you
    # need external access, and lock your AWS security group to your IP.
    # ports:
    #   - "27017:27017"

volumes:
  mongo-data:
